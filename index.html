<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recharge">
<meta name="description" content="Recharge: a SENDtech prototype. Pupils rate the places and moments of the school day on a battery. Fictional demo data only.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Recharge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Lexend:wght@400;600&display=swap">
<style>
/* Layout: one calm column (max 1040px) under a sticky tool bar; pupil screens use big tiles, staff screens use cards and tables. */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --surface-2:#E2EBE8; --ink:#16302D; --ink-2:#4B635F; --line:#C9D8D4;
  --accent:#2B6964; --accent-ink:#FFFFFF; --accent-soft:#D3E8E4; --focus:#1D4ED8;
  --break:#6E4A99; --break-ink:#FFFFFF; --break-soft:#ECE4F5;
  --hi:#3B9781; --mid:#D99A2B; --lo:#D0644B; --hi-bg:#CBE9DE; --mid-bg:#F6E2B3; --lo-bg:#F4C7BA; --none-bg:#EEF1F0;
  --warn-bg:#FBEDE9; --warn-ink:#8A2E1B; --ok-bg:#E1F2EC; --ok-ink:#1F5E4F;
  --zip-teal:#7CC7B8; --zip-lilac:#B9A6E3; --zip-sky:#8EC3EA; --zip-sun:#F2CF6B; --zip-coral:#F0A58F;
  --zip-well:#F4F7F6; --zip-bolt:rgba(255,255,255,.88); --hat:#5A4B8A; --hat-2:#E8B93E; --zip-line:#16302D;
  --av-teal:#BFE3DA; --av-sky:#C7DFF3; --av-lilac:#DCD2F2; --av-sun:#F7E4A6; --av-coral:#F6CDBF; --av-leaf:#D3E6B8; --av-rose:#F3CFE0; --av-slate:#D5DDE3;
  --shadow:0 1px 2px rgba(22,48,45,.06), 0 6px 18px rgba(22,48,45,.07);
  --font-display:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius:20px; --radius-sm:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111718; --surface:#192122; --surface-2:#222C2D; --ink:#DCE6E3; --ink-2:#9FB2AE; --line:#2F3B3C;
  --accent:#86C5BB; --accent-ink:#0D1A18; --accent-soft:#1F3533; --focus:#93B4FF;
  --break:#B99BD9; --break-ink:#1A1225; --break-soft:#2B2338;
  --hi:#62B49E; --mid:#CFA257; --lo:#D98973; --hi-bg:#1E3A33; --mid-bg:#3B3221; --lo-bg:#42271F; --none-bg:#1C2425;
  --warn-bg:#3A2420; --warn-ink:#F2B6A6; --ok-bg:#1C3530; --ok-ink:#A6DCCB;
  --zip-teal:#5FA597; --zip-lilac:#9686C2; --zip-sky:#6FA2C8; --zip-sun:#C9AA55; --zip-coral:#C98875;
  --zip-well:#0F1516; --zip-bolt:rgba(255,255,255,.7); --hat:#8C7CC4; --hat-2:#C9AA55; --zip-line:#0B1112;
  --av-teal:#23423C; --av-sky:#22374A; --av-lilac:#352F4C; --av-sun:#463D20; --av-coral:#4A2E26; --av-leaf:#33402A; --av-rose:#46293A; --av-slate:#2C353C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111718; --surface:#192122; --surface-2:#222C2D; --ink:#DCE6E3; --ink-2:#9FB2AE; --line:#2F3B3C;
  --accent:#86C5BB; --accent-ink:#0D1A18; --accent-soft:#1F3533; --focus:#93B4FF;
  --break:#B99BD9; --break-ink:#1A1225; --break-soft:#2B2338;
  --hi:#62B49E; --mid:#CFA257; --lo:#D98973; --hi-bg:#1E3A33; --mid-bg:#3B3221; --lo-bg:#42271F; --none-bg:#1C2425;
  --warn-bg:#3A2420; --warn-ink:#F2B6A6; --ok-bg:#1C3530; --ok-ink:#A6DCCB;
  --zip-teal:#5FA597; --zip-lilac:#9686C2; --zip-sky:#6FA2C8; --zip-sun:#C9AA55; --zip-coral:#C98875;
  --zip-well:#0F1516; --zip-bolt:rgba(255,255,255,.7); --hat:#8C7CC4; --hat-2:#C9AA55; --zip-line:#0B1112;
  --av-teal:#23423C; --av-sky:#22374A; --av-lilac:#352F4C; --av-sun:#463D20; --av-coral:#4A2E26; --av-leaf:#33402A; --av-rose:#46293A; --av-slate:#2C353C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
html{font-size:17px}
html[data-size="lg"]{font-size:20px}
html[data-font="easy"]{--font-body:"Lexend", "Atkinson Hyperlegible", system-ui, sans-serif}
html[data-font="easy"] body{letter-spacing:.02em; word-spacing:.1em; line-height:1.7}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:1rem; line-height:1.5; -webkit-text-size-adjust:100%}
*{box-sizing:border-box}
*{transition:none!important; animation:none!important}
html[data-motion="on"] .anim{transition:height .4s ease, y .4s ease, background-color .2s ease, transform .2s ease!important}
@media (prefers-reduced-motion: reduce){ html[data-motion="on"] .anim{transition:none!important} }
h1,h2,h3{font-family:var(--font-display); line-height:1.15; text-wrap:balance; margin:0}
h1{font-size:2rem; font-weight:700}
h2{font-size:1.45rem; font-weight:700}
h3{font-size:1.1rem; font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{flex:none}

.wrap{max-width:1040px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.topbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex; align-items:center; gap:10px; padding-block:8px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:1.25rem; margin-right:auto; color:var(--ink)}
.tools{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.tool{min-height:48px; min-width:48px; padding:4px 10px; border-radius:14px; border:1px solid var(--line); background:var(--surface); display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; cursor:pointer; font-size:.72rem; color:var(--ink-2)}
.tool .icon{color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent)}
.tool select{border:0; background:transparent; font-size:.72rem; color:var(--ink-2); padding:0; min-height:0}
.break-btn{min-height:52px; padding:6px 16px; border-radius:16px; border:0; background:var(--break); color:var(--break-ink); font-weight:700; display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:1rem}
main{padding-block:22px 64px}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.spread{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.eyebrow{font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); font-weight:700}

.btn{min-height:48px; padding:10px 18px; border-radius:14px; border:1px solid var(--line); background:var(--surface); display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font-weight:700; text-decoration:none; color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn-quiet{background:transparent; border-color:transparent; color:var(--accent)}
.btn-danger{background:var(--warn-bg); color:var(--warn-ink); border-color:transparent}
.btn-lg{min-height:60px; font-size:1.1rem; padding:12px 24px; border-radius:18px}
.btn[disabled]{opacity:.5; cursor:not-allowed}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); min-width:0}
.card-flat{background:var(--surface-2); border-radius:var(--radius); padding:16px; min-width:0}
.banner{border-radius:14px; padding:12px 16px; display:flex; gap:10px; align-items:flex-start}
.banner-ok{background:var(--ok-bg); color:var(--ok-ink)}
.banner-warn{background:var(--warn-bg); color:var(--warn-ink)}
.banner-info{background:var(--accent-soft); color:var(--ink)}

.tiles{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap:14px}
.tile{min-height:120px; border-radius:var(--radius); border:1px solid var(--line); background:var(--surface); padding:18px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; cursor:pointer; text-align:left; box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent)}
.tile .tile-ic{width:52px; height:52px; border-radius:16px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center}
.tile b{font-family:var(--font-display); font-size:1.2rem}
.tile span{color:var(--ink-2); font-size:.92rem}

.hero{display:flex; gap:20px; align-items:center; flex-wrap:wrap}
.hero .copy{flex:1 1 280px; min-width:0; display:flex; flex-direction:column; gap:8px}

.avatar{border-radius:50%; display:grid; place-items:center; font-family:var(--font-display); font-weight:700; color:var(--ink); flex:none}
.name-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap:12px}
.name-tile{min-height:132px; border-radius:var(--radius); border:2px solid var(--line); background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; cursor:pointer; font-weight:700; font-size:1.1rem; padding:12px}
.name-tile:hover{border-color:var(--accent)}

.code-boxes{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.code-box{width:52px; height:64px; border-radius:14px; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; font-family:var(--font-display); font-size:1.7rem; font-weight:700}
.code-box.on{border-color:var(--accent)}
.keyboard{display:grid; grid-template-columns:repeat(auto-fill, minmax(52px, 1fr)); gap:6px; max-width:640px}
.key{min-height:52px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:1.15rem; cursor:pointer; display:grid; place-items:center}
.key:active{background:var(--accent-soft)}
.pinpad{display:grid; grid-template-columns:repeat(3, 84px); gap:12px; justify-content:center}
.pinpad .key{min-height:76px; font-size:1.7rem; border-radius:20px}
.dots{display:flex; gap:16px; justify-content:center; padding-block:10px}
.dot{width:22px; height:22px; border-radius:50%; border:3px solid var(--accent)}
.dot.on{background:var(--accent)}

.toggle{display:inline-flex; align-items:center; gap:10px; min-height:48px; padding:8px 14px; border-radius:14px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:700}
.toggle .box{width:26px; height:26px; border-radius:8px; border:2px solid var(--accent); display:grid; place-items:center; color:var(--accent-ink)}
.toggle[aria-pressed="true"] .box, .toggle[aria-checked="true"] .box{background:var(--accent)}

.battery{display:inline-flex; align-items:center; gap:4px; padding:5px; border:3px solid var(--ink); border-radius:12px; position:relative; margin-right:8px}
.battery::after{content:""; position:absolute; right:-9px; top:50%; width:6px; height:40%; transform:translateY(-50%); background:var(--ink); border-radius:0 4px 4px 0}
.seg{width:46px; height:48px; border-radius:7px; border:0; background:var(--none-bg); cursor:pointer; display:grid; place-items:center; font-weight:700; color:var(--ink-2); font-size:.8rem}
.battery.sm{border-width:2px; border-radius:7px; padding:2px; gap:2px}
.battery.sm::after{right:-6px; width:4px}
.battery.sm .seg{width:12px; height:16px; border-radius:3px; cursor:default}
.seg.f-lo{background:var(--lo)} .seg.f-mid{background:var(--mid)} .seg.f-hi{background:var(--hi)}
.seg.f-lo, .seg.f-mid, .seg.f-hi{color:var(--surface)}

.slot{display:flex; flex-direction:column; gap:12px}
.slot-head{display:flex; gap:12px; align-items:center}
.slot-ic{width:48px; height:48px; border-radius:14px; background:var(--surface-2); display:grid; place-items:center; flex:none; font-size:1.5rem}
.slot-head .t{min-width:0}
.chip{display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:6px 12px; border-radius:999px; background:var(--surface-2); border:1px solid transparent; font-size:.9rem; font-weight:700}
button.chip{cursor:pointer; min-height:48px}
button.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.pill{display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:999px; font-size:.78rem; font-weight:700}
.pill-lo{background:var(--lo-bg); color:var(--ink)} .pill-hi{background:var(--hi-bg); color:var(--ink)} .pill-mid{background:var(--mid-bg); color:var(--ink)}
.pill-plain{background:var(--surface-2); color:var(--ink-2)}
.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px}
.tab{min-height:48px; padding:8px 14px; border-radius:14px; border:1px solid var(--line); background:var(--surface); display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-weight:700; white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.note-tabs .tab{min-height:56px}

.sym-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap:12px}
.sym{min-height:150px; border-radius:var(--radius); border:2px solid var(--line); background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; cursor:pointer; font-weight:700; font-size:1.1rem; text-align:center; padding:12px}
.sym .sym-ic{width:64px; height:64px; border-radius:20px; display:grid; place-items:center; background:var(--surface-2); color:var(--ink)}
.sym[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.sym.sm{min-height:104px; font-size:.95rem}
.sym.sm .sym-ic{width:44px; height:44px; border-radius:14px}

.photo-thumb{width:100%; max-width:260px; border-radius:14px; border:1px solid var(--line); display:block}
.draw-wrap{border:2px dashed var(--line); border-radius:16px; overflow:hidden; touch-action:none; background:var(--zip-well); max-width:100%}
.draw-wrap canvas{display:block; width:100%; height:260px; touch-action:none}
.swatch{width:48px; height:48px; border-radius:50%; border:3px solid var(--surface); box-shadow:0 0 0 2px var(--line); cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
textarea, input[type=text], input[type=email], input[type=password], select.field{width:100%; min-height:48px; padding:10px 14px; border-radius:14px; border:1px solid var(--line); background:var(--surface)}
textarea{min-height:96px; resize:vertical}
label.lbl{font-weight:700; display:block; margin-bottom:6px}
.file-btn{position:relative; overflow:hidden}
.file-btn input{position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0}

.pins{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap:14px}
.pin-card{display:flex; flex-direction:column; gap:10px; padding:14px}
.pin-media{aspect-ratio:4/3; max-width:100%; border-radius:14px; background:var(--surface-2); display:grid; place-items:center; font-size:3.2rem; overflow:hidden}
.pin-media img{width:100%; height:100%; object-fit:cover}
.emoji-grid{display:flex; flex-wrap:wrap; gap:8px}
.emoji-btn{width:56px; height:56px; border-radius:14px; border:2px solid var(--line); background:var(--surface); font-size:1.7rem; cursor:pointer}
.emoji-btn[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}

.prof-sec{display:flex; flex-direction:column; gap:8px}
.prof-item{display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:14px; background:var(--surface-2)}
.prof-item .txt{flex:1; min-width:0}
.prof-item.is-hidden .txt{opacity:.5; text-decoration:line-through}

.feed-post{display:grid; grid-template-columns:1fr; gap:8px}
.said{border-left:0; background:var(--surface-2); border-radius:14px; padding:12px 14px}
.did{background:var(--ok-bg); color:var(--ok-ink); border-radius:14px; padding:12px 14px}

.overlay{position:fixed; inset:0; z-index:50; background:rgba(10,20,20,.55); display:grid; place-items:center; padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dialog{background:var(--surface); color:var(--ink); border-radius:24px; padding:24px; width:min(640px, 100%); max-height:88vh; overflow:auto; display:flex; flex-direction:column; gap:16px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); z-index:60; background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:14px; max-width:calc(100% - 32px); font-weight:700}
.popover{position:absolute; right:0; top:calc(100% + 6px); z-index:30; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:var(--shadow); width:min(300px, calc(100vw - 32px)); display:flex; flex-direction:column; gap:8px}

/* staff */
.stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap:12px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:2px}
.stat .n{font-family:var(--font-display); font-size:1.8rem; font-weight:700; font-variant-numeric:tabular-nums}
.stat.alert{border-color:var(--lo)}
.table-scroll{overflow-x:auto; max-width:100%}
table.heat{border-collapse:separate; border-spacing:4px; min-width:560px; width:100%}
table.heat th{font-size:.8rem; color:var(--ink-2); font-weight:700; text-align:left; padding:4px 6px; white-space:nowrap}
table.heat td.c{height:46px; border-radius:10px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; font-size:.92rem; color:var(--ink)}
td.c.b-hi{background:var(--hi-bg)} td.c.b-mid{background:var(--mid-bg)} td.c.b-lo{background:var(--lo-bg); box-shadow:inset 0 0 0 2px var(--lo)} td.c.b-none{background:var(--none-bg); color:var(--ink-2)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.85rem; color:var(--ink-2)}
.legend i{display:inline-block; width:16px; height:16px; border-radius:5px; vertical-align:-3px; margin-right:6px}
table.list{border-collapse:collapse; width:100%; min-width:640px}
table.list th, table.list td{padding:10px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle}
table.list th{font-size:.8rem; color:var(--ink-2); text-transform:uppercase; letter-spacing:.06em}
.drift{display:grid; grid-template-columns:minmax(0, 1fr); gap:12px; border-left:6px solid var(--lo)}
.theme-bar{height:14px; border-radius:7px; background:var(--accent)}
.theme-track{background:var(--surface-2); border-radius:7px; flex:1; min-width:80px}
.note{display:flex; flex-direction:column; gap:8px; padding:12px 14px; border-radius:14px; background:var(--surface-2)}
.pin-cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap:10px}
.pin-cardp{border:2px dashed var(--line); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:4px}
.pin-cardp .big{font-family:var(--font-display); font-size:1.8rem; letter-spacing:.2em; font-variant-numeric:tabular-nums}
.check-item{display:flex; gap:12px; align-items:center; min-height:48px; padding:6px 10px; border-radius:12px; background:var(--surface-2); cursor:pointer; border:0; text-align:left; width:100%}
.check-item .box{width:28px; height:28px; border-radius:8px; border:2px solid var(--accent); display:grid; place-items:center; flex:none; color:var(--accent-ink)}
.check-item[aria-checked="true"] .box{background:var(--accent)}
.grid-2{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap:16px; align-items:start}
.demo-box{border:2px dashed var(--line); border-radius:var(--radius); padding:18px; display:flex; flex-direction:column; gap:10px}
code, .mono{font-family:ui-monospace, "SF Mono", Menlo, monospace; font-size:.92em}
.kbd{font-family:var(--font-display); font-weight:700; letter-spacing:.06em; background:var(--surface-2); padding:2px 8px; border-radius:8px}

  for (let r = 0; r < 5000; r++) for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i) + r; h = Math.imul(h, 16777619); }
  return 'fnv$' + (h >>> 0).toString(16);
}

function Zip({ charge, colour = 'teal', hat = 'none', size = 120, label }){
  const id = useId().replace(/:/g, '');
  const c = charge == null ? 0 : clamp(charge, 0, 1);
  const pct = Math.round(c * 100);
  const fill = c >= 0.7 ? 'var(--hi)' : c >= 0.4 ? 'var(--mid)' : 'var(--lo)';
  const shell = 'var(--zip-' + colour + ')';
  return html`<svg viewBox="0 0 120 150" width=${size} height=${size * 1.25} role="img" aria-label=${label || ('Zip the battery buddy, ' + pct + '% charged')} style=${{ flex:'none', maxWidth:'100%' }}>
    <defs><clipPath id=${'well' + id}><rect x="32" y="40" width="56" height="78" rx="11"/></clipPath></defs>
    <path d="M24 82 q-14 6 -14 22" fill="none" stroke=${shell} strokeWidth="7" strokeLinecap="round"/>

    <g clipPath=${'url(#well' + id + ')'}><rect className="anim" x="32" y=${40 + 78 * (1 - c)} width="56" height=${78 * c} fill=${fill}/></g>

}

/* ---------- battery (5 segments) ---------- */
function Battery({ value, onChange, label, small }){
  const t = useApp().t;
  const f = value ? (value <= 2 ? 'f-lo' : value === 3 ? 'f-mid' : 'f-hi') : '';
  if (small) return html`<span className="battery sm" role="img" aria-label=${(label ? label + ': ' : '') + (value ? (Math.round(value * 10) / 10) + ' of 5' : 'no data')}>
    ${[1,2,3,4,5].map(n => html`<span key=${n} className=${'seg ' + (value && n <= Math.round(value) ? (value < 2.5 ? 'f-lo' : value < 3.5 ? 'f-mid' : 'f-hi') : '')}></span>`)}</span>`;
  return html`<div className="row" style=${{ gap:'14px' }}>
    <div className="battery" role="group" aria-label=${label}>
      ${[1,2,3,4,5].map(n => html`<button key=${n} type="button" className=${'seg ' + (value && n <= value ? f : '')} aria-pressed=${value === n} aria-label=${label + ': ' + t('batteryLevel', { n })} onClick=${() => onChange(value === n ? null : n)}>${n}</button>`)}
    </div>
    <span className="muted small">${value ? t('batteryLevel', { n:value }) : t('notRated')}</span>
  </div>`;
}

function Avatar({ pupil, size = 56 }){
  return html`<span className="avatar" aria-hidden="true" style=${{ width:size, height:size, background:'var(--av-' + pupil.avatar + ')', fontSize:size * 0.42 }}>${pupil.name[0]}</span>`;
}

function Sparkline({ values, w = 140, h = 40, label }){
  const pts = values.filter(v => v != null);
  if (pts.length < 2) return null;
  const x = (i) => 4 + i * (w - 8) / (pts.length - 1);
  const y = (v) => 4 + (5 - v) * (h - 8) / 4;
  const line = pts.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const area = line + ' L' + x(pts.length - 1).toFixed(1) + ' ' + (h - 4) + ' L' + x(0).toFixed(1) + ' ' + (h - 4) + ' Z';
  const last = pts[pts.length - 1];
  return html`<svg width=${w} height=${h} viewBox=${'0 0 ' + w + ' ' + h} role="img" aria-label=${label || ('Battery trend: ' + pts.map(v => v.toFixed(1)).join(', '))} style=${{ maxWidth:'100%', flex:'none' }}>
    <line x1="4" x2=${w - 4} y1=${y(2.5)} y2=${y(2.5)} stroke="var(--line)" strokeDasharray="3 3"/>
    <path d=${area} fill="var(--accent-soft)"/>
    <path d=${line} fill="none" stroke="var(--accent)" strokeWidth="2.2" strokeLinejoin="round"/>
    <circle cx=${x(pts.length - 1)} cy=${y(last)} r="4" fill=${'var(--' + band(last) + ')'} stroke="var(--surface)" strokeWidth="1.5"/>
  </svg>`;
}

function slotLabel(d, pupilId, sid){
  if (sid.startsWith('pin_')) { const p = d.pins.find(x => 'pin_' + x.id === sid); return p ? p.emoji + ' ' + p.caption : 'Personal place'; }
  const pupil = d.pupils.find(p => p.id === pupilId);
  const s = (d.slots[pupil ? pupil.classId : 'c6b'] || SLOT_DEFS).find(x => x.id === sid);
  return s ? s.name + ' (' + s.place + ')' : sid;
}
function pupilSeries(d, pid){ return d.checkins.filter(c => c.pupilId === pid).sort((a, b) => a.date < b.date ? -1 : 1).map(c => ({ date:c.date, avg:avg(Object.values(c.ratings)), c })); }
function driftInfo(avgs){
  const a = avgs.filter(v => v != null);
  if (a.length < 5) return null;
  // smooth each check-in with the one before, so one partial check-in can't hide a slide
  const sm = a.slice(1).map((v, i) => (v + a[i]) / 2);
  let drops = 0, start = sm.length - 1;
  for (let i = sm.length - 1; i > 0; i--) {
    const diff = sm[i] - sm[i - 1];
    if (diff < -0.05) { drops++; start = i - 1; } else if (Math.abs(diff) <= 0.1) { start = i - 1; } else break;
  }
  if (drops < 3) return null;
  const from = a[start], to = a[a.length - 1];
  if (from - to < 0.6) return null;
  return { drops, from, to };
}
function noteList(d, pid, limit){
  const out = [];
  pupilSeries(d, pid).slice().reverse().forEach(({ c }) => {
    for (const [sid, n] of Object.entries(c.notes || {})) out.push({ pupilId:pid, date:c.date, sid, label:slotLabel(d, pid, sid), n, rating:c.ratings[sid] });
  });
  return limit ? out.slice(0, limit) : out;
}
function helpAnswers(d, pupilIds){
  const out = [];
  for (const c of d.checkins) {
    if (!pupilIds.has(c.pupilId)) continue;
    for (const [sid, n] of Object.entries(c.notes || {})) {
      const h = n.help || {}; const parts = [].concat(h.chips || [], h.text ? [h.text] : []);
      if (!parts.length) continue;
      const text = h.text || (h.chips || []).join(', ');
      out.push({ pupilId:c.pupilId, date:c.date, text, all:parts.join(' '), slot:slotLabel(d, c.pupilId, sid) });
    }
  }
  return out;
}

/* Profile: auto-built from the pupil's own ratings, symbols, pins and words. The pupil hides, edits and approves it. */
const SYM_DRAIN = { tooLoud:'Places that are too loud', tooBright:'Bright lights', tooCrowded:'Crowded places', needBreakSym:'Going a long time without a break' };
function syncProfile(d, pid){
  const pupil = d.pupils.find(p => p.id === pid);
  const prof = d.profiles[pid] || { items:[], approvedAt:null, approvedSnapshot:null, dirty:false };
  const cs = d.checkins.filter(c => c.pupilId === pid);
  const bySlot = {};
  for (const c of cs) for (const [sid, v] of Object.entries(c.ratings)) (bySlot[sid] = bySlot[sid] || []).push(v);
  const want = [];
  const slots = d.slots[pupil.classId] || [];
  const seenPlace = new Set();
  for (const s of slots) {
    const a = avg(bySlot[s.id] || []); if (a == null) continue;
    const key = s.place + '|' + (a <= 2.5 ? 'd' : a >= 4 ? 'h' : '');
    if (seenPlace.has(key)) continue; seenPlace.add(key);
    if (a <= 2.5) want.push({ section:'drains', text:s.place + (s.name === 'Changeover' ? ' at changeover' : ' at ' + s.name.toLowerCase()), src:'ratings' });
    else if (a >= 4.2) want.push({ section:'helps', text:s.name + ' in ' + s.place, src:'ratings' });
  }
  const symCount = {};
  for (const c of cs) for (const n of Object.values(c.notes || {})) for (const s of (n.symbols || [])) symCount[s] = (symCount[s] || 0) + 1;
  for (const [s, n] of Object.entries(symCount)) {
    if (s === 'feelsSafe') want.push({ section:'helps', text:'Places that feel safe', src:'symbols' });
    else if (SYM_DRAIN[s]) want.push({ section:'drains', text:SYM_DRAIN[s], src:'symbols' });
  }
  for (const p of d.pins.filter(x => x.pupilId === pid)) want.push({ section:p.tag === 'drains' ? 'drains' : 'helps', text:p.emoji + ' ' + p.caption, src:'walk' });
  const helps = new Set();
  for (const c of cs) for (const n of Object.values(c.notes || {})) { const h = n.help || {}; (h.chips || []).forEach(x => helps.add(x)); if (h.text) helps.add(h.text); }
  helps.forEach(h => want.push({ section:'helps', text:h.charAt(0).toUpperCase() + h.slice(1), src:'help' }));
  for (const c of cs) for (const n of Object.values(c.notes || {})) if (n.text) want.push({ section:'words', text:'"' + n.text + '"', src:'typed' });
  let added = false;
  for (const w of want) {
    if (!prof.items.some(i => i.section === w.section && i.text === w.text)) { prof.items.push(Object.assign({ id:uid('it'), hidden:false }, w)); added = true; }
  }
  if (added && prof.approvedSnapshot) prof.dirty = true;
  d.profiles[pid] = prof;
}
function approveProfile(d, pid){
  const prof = d.profiles[pid]; if (!prof) return;
  prof.approvedAt = Date.now();
  prof.approvedSnapshot = prof.items.filter(i => !i.hidden).map(i => ({ section:i.section, text:i.text }));
  prof.dirty = false;
}

const plainDownloads = {

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();

function useCap(name){
  const [cap, setCap] = useState(undefined);
  useEffect(() => {
    let live = true;
    if (!capCache[name]) capCache[name] = (window.claude && window.claude.use ? window.claude.use(name) : Promise.resolve(name === 'downloads' ? plainDownloads : null)).catch(() => null);
    capCache[name].then(v => { if (live) setCap(v || null); });
    return () => { live = false; };
  }, [name]);
  return cap;
}
const AI_RULES = 'You are helping school staff read short notes from pupils aged 9-12. Never diagnose, never label or guess emotions, never interpret images or drawings, and never add meaning that is not in the words. The pupil\'s own words are the meaning.';

const R = {
  hull:{ short:'Hull et al. (2017)',
    cite:'Hull, L., Petrides, K.V., Allison, C., Smith, P., Baron-Cohen, S., Lai, M.-C. & Mandy, W. (2017) "Putting on my best normal": social camouflaging in adults with autism spectrum conditions. Journal of Autism and Developmental Disorders, 47, 2519–2534.',
    finding:'Autistic adults described camouflaging: hiding autistic traits and copying others so they could fit in and connect. They said it took constant effort, left them exhausted afterwards, and harmed their mental health and sense of who they are. Because camouflaging works, the people around them often did not notice they were struggling.' },
  halsall:{ short:'Halsall, Clarke & Crane (2021)',

    finding:'Autistic girls described hiding their difficulties to fit in with peers, especially in mainstream classes. Girls, mothers and educators agreed this was tiring, and the effects were often seen at home rather than in school, so school staff could underestimate how hard the day had been.' },
  raymaker:{ short:'Raymaker et al. (2020)',
    cite:'Raymaker, D.M. et al. (2020) "Having all of your internal resources exhausted beyond measure and being left with no clean-up crew": defining autistic burnout. Autism in Adulthood, 2(2).',
    finding:'Autistic people defined autistic burnout as long-term exhaustion, loss of skills and lower tolerance of sensory input. It builds up from everyday demands that outweigh a person\'s resources, and masking adds to it. Participants described it as running out of internal resources, which is an energy idea, not a mood.' },
  kinnaird:{ short:'Kinnaird, Stewart & Tchanturia (2019)',

    finding:'Pooling many studies, the review found that around half of autistic people have alexithymia (difficulty identifying and describing their own emotions), compared with about 1 in 20 people in comparison groups. Tools that ask autistic young people to name or pick their feelings can therefore give unreliable answers.' },
  uncrc1213:{ short:'UNCRC Articles 12 & 13 (1989)',
    cite:'United Nations (1989) Convention on the Rights of the Child, Articles 12 and 13.',
    finding:'Article 12 gives every child the right to express their views on matters that affect them, and to have those views given due weight. Article 13 says children can express themselves "in the form of art, or through any other media of the child\'s choice", not only in speech or writing.' },
  mosaic:{ short:'Clark & Moss (2011)',
    cite:'Clark, A. & Moss, P. (2011) Listening to Young Children: The Mosaic Approach (2nd ed.). London: National Children\'s Bureau.',
    finding:'The Mosaic approach treats children as experts in their own lives. It combines several ways of listening, including children\'s own photographs, child-led tours of their setting, map-making and talk, and pieces them together. No single method is relied on, and children explain what their own images mean.' },
  talkingmats:{ short:'Murphy & Cameron (2008)',

    finding:'People with intellectual disabilities communicated their views more effectively with Talking Mats, a symbol-based tool, than in their usual conversations: they understood more, stayed engaged for longer and gave clearer answers. Picture symbols lower the language demand of saying what you think.' },
  photovoice:{ short:'Wang & Burris (1997)',
    cite:'Wang, C. & Burris, M.A. (1997) Photovoice: concept, methodology, and use for participatory needs assessment. Health Education & Behavior, 24(3), 369–387.',
    finding:'Photovoice gives people cameras to record the strengths and problems of their own community, then uses their photos and their own explanations to start discussion and reach decision-makers. The people who take the photos decide what the images mean.' },
  bomber:{ short:'Bombèr (2007)',
    cite:'Bombèr, L.M. (2007) Inside I\'m Hurting: Practical strategies for supporting children with attachment difficulties in schools. London: Worth Publishing.',
    finding:'Bombèr recommends that a vulnerable child has a named key adult in school who acts as a secure base: someone who checks in regularly, notices early signs of stress, and is available when the child needs a break. Children settle better when they know exactly who to go to.' },
  sendcop:{ short:'SEND Code of Practice (2015)',
    cite:'Department for Education & Department of Health (2015) Special educational needs and disability code of practice: 0 to 25 years. Chapter 1 (Principles) and Chapter 6 (Schools).',
    finding:'The Code says those supporting children with SEND must have regard to the child\'s views, wishes and feelings, and to the importance of the child taking part in decisions. Schools are expected to involve pupils in planning and reviewing their support, and to share useful information when pupils move between settings.' },
  lundy:{ short:'Lundy (2007)',
    cite:'Lundy, L. (2007) "Voice" is not enough: conceptualising Article 12 of the United Nations Convention on the Rights of the Child. British Educational Research Journal, 33(6), 927–942.',
    finding:'Lundy argues that letting children speak is not enough. Article 12 needs four things: Space (a safe chance to give views), Voice (help to express them), Audience (someone with power listens) and Influence (views are acted on, and children are told what happened and why).' },
  sdt:{ short:'Ryan & Deci (2000)',

    finding:'People stay motivated when three needs are met: autonomy (real choice), competence (feeling able) and relatedness (feeling connected). Activities people choose and own are kept up for longer than ones they feel pushed into.' },
  ashburner:{ short:'Ashburner, Ziviani & Rodger (2008)',

    finding:'Autistic children in mainstream classes showed more sensory processing differences than their classmates, especially difficulty filtering out background noise. These differences were linked to emotional and behavioural difficulties and lower academic results, which points to the sensory environment as part of the problem.' },

  useEffect(() => { (async () => { let d = readJSON(DB_KEY, null); if (!d || d.version !== 1) { d = await buildSeed(); ls.set(DB_KEY, JSON.stringify(d)); } dbRef.current = d; setDb(d); })(); }, []);

  const update = useCallback((fn) => {
    const next = clone(dbRef.current);
    const r = fn(next);
    dbRef.current = next; setDb(next);
    if (!ls.set(DB_KEY, JSON.stringify(next))) showToast('This device is out of storage space. Try a smaller photo, or reset the demo.');
    return r;
  }, [showToast]);

  const resetDemo = async () => {
    ls.del(DB_KEY); ls.del(REMEMBER_KEY); setSession(null);
    const d = await buildSeed(); ls.set(DB_KEY, JSON.stringify(d)); dbRef.current = d; setDb(d);
    showToast('Demo reset. Fresh fictional data loaded.');
  };

  useEffect(() => {
    const r = document.documentElement;
    if (prefs.theme === 'system') { if (hostTheme) r.setAttribute('data-theme', hostTheme); else r.removeAttribute('data-theme'); }
    else r.setAttribute('data-theme', prefs.theme);
    r.setAttribute('data-font', prefs.font); r.setAttribute('data-motion', prefs.motion ? 'on' : 'off'); r.setAttribute('data-size', prefs.size);
    r.setAttribute('lang', (LANGS.find(l => l[0] === prefs.lang) || LANGS[0])[2]);
  }, [prefs]);

  // inactivity timeout (shared iPads)
  useEffect(() => {
    if (!session) return;
    let last = Date.now();
    const bump = () => { last = Date.now(); if (Date.now() - (readJSON(SESSION_KEY, {}).last || 0) > 30000) ls.set(SESSION_KEY, JSON.stringify(Object.assign({}, session, { last }))); };
    const evs = ['pointerdown','keydown','scroll','touchstart'];
    evs.forEach(e => window.addEventListener(e, bump, { passive:true }));
    const iv = setInterval(() => { if (Date.now() - last > TIMEOUT_MS) { setSession(null); showToast(I18N[prefs.lang].timeout); } }, 15000);
    return () => { evs.forEach(e => window.removeEventListener(e, bump)); clearInterval(iv); };
  }, [session && session.id]);

  const t = useCallback((k, vars) => {
    let s = (I18N[prefs.lang] && I18N[prefs.lang][k]) != null ? I18N[prefs.lang][k] : (I18N.en[k] != null ? I18N.en[k] : k);
    if (typeof s === 'string' && vars) s = s.replace(/\{(\w+)\}/g, (m, key) => vars[key] != null ? vars[key] : m);
    return s;
  }, [prefs.lang]);
  const tr = useCallback((s) => (SLOT_I18N[prefs.lang] && SLOT_I18N[prefs.lang][s]) || s, [prefs.lang]);

  if (!db) return html`<div className="wrap" style=${{ paddingBlock:'48px' }}><p className="muted">Loading Recharge…</p></div>`;

  const me = session && session.kind === 'pupil' ? db.pupils.find(p => p.id === session.id) : null;
  const staff = session && session.kind === 'staff' ? db.staff.find(s => s.id === session.id) : null;
  const ctx = { db, update, prefs, setPrefs, t, tr, session, setSession, showToast, resetDemo, me, staff };

  const logBreak = () => {
    update(d => { d.moments.unshift({ id:uid('m'), pupilId:me.id, kind:'break', at:Date.now(), seen:false }); });
    setBreakOpen(true);
  };

  return html`<${AppCtx.Provider} value=${ctx}>
    <${TopBar} onBreak=${me ? logBreak : null}/>
    <main id="main" className="wrap">
      ${me ? html`<${PupilApp}/>` : staff ? html`<${StaffApp}/>` : html`<${Entry}/>`}
    </main>
    ${breakOpen && me && html`<${Dialog} onClose=${() => setBreakOpen(false)} label=${t('needBreak')}>
      <div className="zip-stage"><${Zip} charge=${0.2} colour=${me.buddy.colour} hat=${me.buddy.hat} size=${90}/><div className="stack" style=${{ flex:'1 1 220px' }}>
        <h2>${t('needBreak')}</h2>
        <p style=${{ fontSize:'1.15rem' }}>${t('breakSent', { adult:(db.staff.find(s => s.id === me.keyAdultId) || {}).name || 'Your key adult' })}</p>
        <${Why} k="break"/>
      </div></div>
      <button className="btn btn-primary btn-lg" onClick=${() => setBreakOpen(false)}><${Icon} name="check"/>${t('ok')}</button>
    <//>`}
    <div aria-live="polite" className="sr-only">${toast || ''}</div>
    ${toast && html`<div className="toast" role="status">${toast}</div>`}
  <//>`;
}

function Dialog({ children, onClose, label }){
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    const el = ref.current; const f = el && el.querySelector('button, [href], input, select, textarea');
    if (f) f.focus();
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => { window.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); };
  }, []);
  return html`<div className="overlay" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="dialog" role="dialog" aria-modal="true" aria-label=${label} ref=${ref}>${children}</div>
  </div>`;
}

function CodeEntry({ onBack, onFound }){
  const { t, db } = useApp();
  const [val, setVal] = useState('');
  const [remember, setRemember] = useState(false);
  const [err, setErr] = useState('');
  const KEYS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const press = (k) => { setErr(''); setVal(v => (v + k).slice(0, 5)); };
  const del = () => setVal(v => v.slice(0, -1));
  const submit = (v) => {
    const c = db.classes.find(x => x.code.replace('-', '') === (v || val));
    if (c) onFound(c.id, remember); else setErr(t('codeWrong'));
  };
  useEffect(() => {
    const h = (e) => {
      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key === 'Backspace') { del(); e.preventDefault(); }
      else if (e.key === 'Enter') submit();
      else if (/^[a-z0-9]$/i.test(e.key)) press(e.key.toUpperCase());
    };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  });
  const shown = val.padEnd(5, ' ').split('');
  return html`<div className="stack">
    <h1>${t('enterCode')}</h1>
    <p className="muted">${t('codeHint')}</p>
    <div className="code-boxes" aria-live="polite" aria-label=${'Class code so far: ' + (val || 'empty')}>
      ${shown.slice(0, 2).map((ch, i) => html`<span key=${i} className=${'code-box ' + (i === val.length ? 'on' : '')}>${ch}</span>`)}
      <span style=${{ fontSize:'1.6rem', fontWeight:700 }} aria-hidden="true">-</span>
      ${shown.slice(2).map((ch, i) => html`<span key=${i + 2} className=${'code-box ' + (i + 2 === val.length ? 'on' : '')}>${ch}</span>`)}
    </div>
    <div className="keyboard" role="group" aria-label="Letters and numbers">
      ${KEYS.map(k => html`<button key=${k} type="button" className="key" onClick=${() => press(k)}>${k}</button>`)}
      <button type="button" className="key" onClick=${del} aria-label="Delete"><${Icon} name="del"/></button>
    </div>
    ${err && html`<div className="banner banner-warn" role="alert"><${Icon} name="alert"/>${err}</div>`}
    <div className="row">
      <button type="button" className="toggle" role="checkbox" aria-checked=${remember} onClick=${() => setRemember(!remember)}><span className="box">${remember && html`<${Icon} name="check" size=${18}/>`}</span>${t('remember')}</button>
    </div>
    <div className="row">
      <button className="btn" onClick=${onBack}><${Icon} name="back"/>${t('back')}</button>
      <button className="btn btn-primary btn-lg" disabled=${val.length < 5} onClick=${() => submit()}>${t('next')}<${Icon} name="check"/></button>
      <button className="btn btn-quiet" onClick=${() => { setVal('6BK4P'); submit('6BK4P'); }}><${Icon} name="zap"/>${t('useDemo')}</button>
    </div>
  </div>`;
}

function PinEntry({ pupil, onBack, onOk }){
  const { t, update } = useApp();
  const [pin, setPin] = useState('');
  const [msg, setMsg] = useState(pupil.locked ? t('locked') : '');
  const [busy, setBusy] = useState(false);
  const check = async (p) => {
    if (pupil.locked) { setMsg(t('locked')); setPin(''); return; }
    setBusy(true);
    const h = await hashSecret(p, pupil.salt);
    setBusy(false);
    if (h === pupil.pinHash) { update(d => { const x = d.pupils.find(q => q.id === pupil.id); x.failed = 0; }); onOk(); return; }
    const res = update(d => { const x = d.pupils.find(q => q.id === pupil.id); x.failed = (x.failed || 0) + 1; if (x.failed >= 5) x.locked = true; return x; });
    setPin('');
    setMsg(res.locked ? t('locked') : t('pinWrong', { n:5 - res.failed }));
  };
  const press = (k) => { if (busy) return; setMsg(m => pupil.locked ? m : ''); setPin(p => { const n = (p + k).slice(0, 4); if (n.length === 4) setTimeout(() => check(n), 120); return n; }); };
  const del = () => setPin(p => p.slice(0, -1));
  useEffect(() => {
    const h = (e) => { if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') del(); };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  });
  return html`<div className="stack" style=${{ alignItems:'center', textAlign:'center' }}>
    <${Avatar} pupil=${pupil} size=${80}/>
    <h1>${pupil.name}</h1>
    <h2 style=${{ fontSize:'1.2rem' }}>${t('enterPin')}</h2>
    <div className="dots" aria-label=${pin.length + ' of 4 digits entered'} role="status">${[0,1,2,3].map(i => html`<span key=${i} className=${'dot ' + (i < pin.length ? 'on' : '')}></span>`)}</div>
    ${msg && html`<div className=${'banner ' + (pupil.locked || msg === t('locked') ? 'banner-warn' : 'banner-info')} role="alert"><${Icon} name=${pupil.locked ? 'lock' : 'alert'}/>${msg}</div>`}
    <div className="pinpad" role="group" aria-label="Number pad">
      ${['1','2','3','4','5','6','7','8','9'].map(k => html`<button key=${k} type="button" className="key" onClick=${() => press(k)}>${k}</button>`)}
      <button type="button" className="key" onClick=${del} aria-label="Delete"><${Icon} name="del" size=${28}/></button>
      <button type="button" className="key" onClick=${() => press('0')}>0</button>
      <button type="button" className="key" onClick=${onBack} aria-label=${t('back')}><${Icon} name="back" size=${28}/></button>
    </div>
    <${Why} k="security"/>
  </div>`;
}

function fileToDataUrl(file, max){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file is not a photo we can open.')); };
    img.src = url;
  });
}
function PhotoPicker({ value, onChange, label }){

  return html`<div className="stack">

function VoicePicker({ value, onChange }){

function DrawPad({ value, onChange }){
  const { t } = useApp();
  const ref = useRef(null);
  const [colour, setColour] = useState(0);
  const COLS = ['#16302D','#2B6964','#6E4A99','#D0644B','#D99A2B'];
  const drawing = useRef(false);
  const paper = '#F7FAF9';
  const init = useCallback(() => {
    const c = ref.current; if (!c) return;
    const r = c.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1;
    c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
    const g = c.getContext('2d'); g.scale(dpr, dpr); g.fillStyle = paper; g.fillRect(0, 0, r.width, r.height);
    if (value) { const img = new Image(); img.onload = () => g.drawImage(img, 0, 0, r.width, r.height); img.src = value; }
  }, []);
  useEffect(() => { init(); }, []);
  const pos = (e) => { const r = ref.current.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const down = (e) => { drawing.current = true; ref.current.setPointerCapture(e.pointerId); const g = ref.current.getContext('2d'); g.strokeStyle = COLS[colour]; g.lineWidth = 5; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); const [x, y] = pos(e); g.moveTo(x, y); g.lineTo(x + 0.1, y + 0.1); g.stroke(); };
  const move = (e) => { if (!drawing.current) return; const g = ref.current.getContext('2d'); const [x, y] = pos(e); g.lineTo(x, y); g.stroke(); };
  const up = () => { if (!drawing.current) return; drawing.current = false; onChange(ref.current.toDataURL('image/png')); };
  const clear = () => { const c = ref.current; const g = c.getContext('2d'); const r = c.getBoundingClientRect(); g.fillStyle = paper; g.fillRect(0, 0, r.width, r.height); onChange(null); };
  return html`<div className="stack">
    <p className="muted small">${t('drawHint')}</p>
    <div className="draw-wrap"><canvas ref=${ref} aria-label="Drawing space" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerLeave=${up}></canvas></div>
    <div className="row">${COLS.map((c, i) => html`<button key=${c} type="button" className="swatch" style=${{ background:c }} aria-pressed=${colour === i} aria-label=${'Pen colour ' + (i + 1)} onClick=${() => setColour(i)}></button>`)}
      <button type="button" className="btn" onClick=${clear}><${Icon} name="refresh"/>${t('clear')}</button></div>
  </div>`;
}

function StaffLogin({ onExit }){
  const { db, setSession } = useApp();
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const login = async (e, em, p) => {
    if (e) e.preventDefault();
    const address = (em || email).trim().toLowerCase(); const pass = p || pw;
    const s = db.staff.find(x => x.email === address);
    setBusy(true);
    const ok = s && (await hashSecret(pass, s.salt)) === s.pwHash;
    setBusy(false);
    if (ok) setSession({ kind:'staff', id:s.id }); else setErr('That email and password do not match. Check them and try again.');
  };
  return html`<div className="grid-2">
    <form className="card stack" onSubmit=${login} aria-label="Staff log in">
      <h1>Staff log in</h1>
      <div><label className="lbl" htmlFor="st-email">Email</label><input id="st-email" type="email" autoComplete="username" value=${email} onChange=${(e) => setEmail(e.target.value)}/></div>
      <div><label className="lbl" htmlFor="st-pw">Password</label><input id="st-pw" type="password" autoComplete="current-password" value=${pw} onChange=${(e) => setPw(e.target.value)}/></div>

      <div className="row"><button type="button" className="btn" onClick=${onExit}><${Icon} name="back"/>Back</button><button className="btn btn-primary" disabled=${busy}><${Icon} name="key"/>Log in</button></div>

      <div className=${'stat ' + (moments.some(m => !m.seen) ? 'alert' : '')}><span className="muted small">New requests</span><span className="n">${moments.filter(m => !m.seen).length}</span></div>
    </div>

    <section className="card stack" aria-label="Heatmap">
      <div className="spread"><div><h2>Where energy goes</h2><p className="muted small">Average battery per slot, last ${dates.length} check-ins. 5 = fully charged.</p></div>
        <label className="row"><span className="sr-only">Show</span><select className="field" style=${{ width:'auto' }} value=${filter} onChange=${(e) => setFilter(e.target.value)}><option value="all">Whole class</option>${pupils.map(p => html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select></label></div>
      <div className="table-scroll"><table className="heat">
        <thead><tr><th scope="col">Slot · place</th>${dates.map(dt => html`<th key=${dt} scope="col">${fmtDay(dt)}</th>`)}</tr></thead>
        <tbody>${rows.map(({ s, cells }) => html`<tr key=${s.id}><th scope="row"><span className="row" style=${{ gap:'6px', flexWrap:'nowrap' }}><${Icon} name=${s.icon} size=${16}/>${s.name}<span className="muted" style=${{ fontWeight:400 }}>· ${s.place}</span></span></th>
          ${cells.map((v, i) => html`<td key=${i} className=${'c b-' + band(v)} aria-label=${s.name + ' ' + fmtDay(dates[i]) + ': ' + (v == null ? 'no data' : v.toFixed(1) + ', ' + BAND_LABEL[band(v)])}>${v == null ? '–' : v.toFixed(1)}</td>`)}</tr>`)}</tbody>
      </table></div>
      <div className="legend"><span><i style=${{ background:'var(--hi-bg)' }}></i>Recharges (3.5+)</span><span><i style=${{ background:'var(--mid-bg)' }}></i>Some drain (2.5–3.4)</span><span><i style=${{ background:'var(--lo-bg)', boxShadow:'inset 0 0 0 2px var(--lo)' }}></i>High drain (under 2.5, outlined)</span></div>
      <${Why} k="heatmap"/>

function ThemesTab({ classId }){
  const { db, staff, showToast } = useApp();
  const sample = useCap('sample');
  const pupils = Access.visiblePupils(db, staff, classId);
  const answers = helpAnswers(db, new Set(pupils.map(p => p.id)));
  const groups = {};
  for (const a of answers) { const k = themeOf(a.all); (groups[k] = groups[k] || []).push(a); }
  const list = Object.entries(groups).map(([k, v]) => ({ k, label:k === 'other' ? 'Other ideas' : THEMES.find(t => t.id === k).label, items:v, pupils:new Set(v.map(x => x.pupilId)).size })).sort((a, b) => b.items.length - a.items.length);
  const max = Math.max(1, ...list.map(l => l.items.length));
  const [ai, setAi] = useState(null);
  const [busy, setBusy] = useState(false);
  const runAi = async () => {
    setBusy(true);
    try {
      const r = await sample.json(AI_RULES + '\n\nThese are anonymous answers from pupils to the question "What would help?". Group them into 3 to 6 themes a teacher could act on. Use plain, practical theme names. Reply with only JSON: [{"theme": "...", "count": 3, "examples": ["exact pupil words", "..."]}]. Examples must be copied exactly from the answers.\n\nAnswers:\n' + answers.map(a => '- ' + a.text).join('\n'), { modelTier:'default' });
      if (Array.isArray(r)) setAi(r); else showToast('AI returned something unexpected. Showing keyword groups.');
    } catch(e){ showToast(aiErr(e)); }
    setBusy(false);
  };
  return html`<div className="stack">
    <section className="card stack">
      <div className="spread"><div><h2>Most asked for</h2><p className="muted small">${answers.length} answers to "What would help?" from ${new Set(answers.map(a => a.pupilId)).size} pupils, grouped by keywords.</p></div>
        ${sample ? html`<button className="btn" onClick=${runAi} disabled=${busy || !answers.length}><${Icon} name="sparkles"/>${busy ? 'Grouping…' : 'Group with AI'}</button>` : html`<span className="pill pill-plain">AI off · keyword grouping</span>`}</div>
      ${list.map(l => html`<div key=${l.k} className="stack" style=${{ gap:'6px' }}>
        <div className="spread"><b>${l.label}</b><span className="small muted mono">${l.items.length} answers · ${l.pupils} pupils</span></div>
        <div className="theme-track"><div className="theme-bar" style=${{ width:(l.items.length / max * 100) + '%' }}></div></div>
        <p className="small muted">${l.items.slice(0, 4).map(x => '"' + x.text + '"').join('  ·  ')}</p>
      </div>`)}
      <${Why} k="themes"/>
    </section>
    ${ai && html`<section className="card stack"><div><h2 className="row" style=${{ gap:'8px' }}><${Icon} name="sparkles"/>AI summary</h2><p className="muted small">Check this against the pupils' own words. AI does not interpret images or feelings.</p><${Why} k="ai"/></div>
      ${ai.map((g, i) => html`<div key=${i} className="note"><div className="spread"><b>${g.theme}</b><span className="small mono">${g.count}</span></div><p className="small muted">${(g.examples || []).map(e => '"' + e + '"').join('  ·  ')}</p></div>`)}
    </section>`}
  </div>`;
}

function YswdTab({ classId, setTab }){
  const { db, staff, update, showToast } = useApp();
  const pupils = Access.visiblePupils(db, staff, classId);
  const answers = helpAnswers(db, new Set(pupils.map(p => p.id)));
  const counts = {}; answers.forEach(a => { const k = themeOf(a.all); counts[k] = (counts[k] || 0) + 1; });
  const top = Object.entries(counts).filter(([k]) => k !== 'other').sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k]) => THEMES.find(t => t.id === k).label);
  const [said, setSaid] = useState('');
  const [did, setDid] = useState('');
  const post = (e) => { e.preventDefault(); update(d => { d.feed.unshift({ id:uid('f'), classId, said:said.trim(), did:did.trim(), by:staff.name, at:Date.now() }); }); setSaid(''); setDid(''); showToast('Posted to pupils\' feeds.'); };
  const posts = db.feed.filter(f => f.classId === classId).sort((a, b) => b.at - a.at);
  return html`<div className="grid-2">
    <form className="card stack" onSubmit=${post} aria-label="Post a change">
      <h2>Tell pupils what changed</h2>
      <div className="stack" style=${{ gap:'8px' }}><label className="lbl" htmlFor="ys-said">You said</label>
        <div className="row">${top.map(tp => html`<button key=${tp} type="button" className="chip" aria-pressed=${said === tp} onClick=${() => setSaid(tp)}>${tp}</button>`)}</div>
        <input id="ys-said" type="text" value=${said} onChange=${(e) => setSaid(e.target.value)} placeholder="For example: The lunch hall is too loud."/></div>
      <div><label className="lbl" htmlFor="ys-did">We did</label><textarea id="ys-did" value=${did} onChange=${(e) => setDid(e.target.value)} placeholder="Say what changed, when, and where. Keep it short and concrete."></textarea></div>
      <div><button className="btn btn-primary" disabled=${!said.trim() || !did.trim()}><${Icon} name="megaphone"/>Post to class feed</button></div>
      <${Why} k="feed"/>
    </form>
    <section className="stack" aria-label="Posted">
      <h2>Posted</h2>
      ${posts.map(p => html`<article key=${p.id} className="card feed-post"><p className="muted small">${fmtTime(p.at)} · ${p.by}</p><div className="said"><p className="eyebrow">You said</p><p>${p.said}</p></div><div className="did"><p className="eyebrow" style=${{ color:'inherit' }}>We did</p><p>${p.did}</p></div></article>`)}
    </section>
  </div>`;
}

const CHECKLIST = [
  ['read','Read the full note and any earlier notes'],
  ['spoke','Spoken with the pupil today, in a safe and quiet place'],
  ['record','Recorded on the school safeguarding system (e.g. CPOMS / MyConcern)'],
  ['immediate','Considered whether the pupil is at immediate risk (call 999 if so)'],
  ['parents','Decided whether to inform parents or carers (unless this would increase risk)'],
  ['referral','Considered referral to children\'s social care or early help'],
  ['followup','Follow-up date set and key adult informed']
];
function SafeTab(){
  const { db, staff, update } = useApp();
  if (!Access.canSeeSafeguarding(staff)) {
    const dsl = db.staff.find(s => s.role === 'dsl');
    return html`<section className="card stack"><h2 className="row" style=${{ gap:'8px' }}><${Icon} name="shield"/>Safeguarding</h2>
      <p>If a pupil's note contains concerning words, Recharge sends it straight to the safeguarding lead${dsl ? ', ' + dsl.name : ''}. Only they see the flag here.</p>
      <p className="muted">If you are worried about a pupil right now, follow your school's safeguarding policy and speak to the DSL in person. Recharge does not replace that.</p><${Why} k="safe"/></section>`;
  }
  return html`<div className="stack">
    <div className="banner banner-info"><${Icon} name="shield"/><div><b>Keyword flags, for a human to review.</b> Recharge spots words such as hurt, unsafe or self-harm. It doesn't judge risk or interpret images. Follow your school's safeguarding policy.</div></div>
    <${Why} k="safe"/>
    ${db.flags.length === 0 && html`<div className="card"><p className="muted">No flags.</p></div>`}
    ${db.flags.map(f => { const p = db.pupils.find(x => x.id === f.pupilId); const done = CHECKLIST.filter(([k]) => f.checklist[k]).length;
      return html`<article key=${f.id} className="card stack" style=${{ borderLeft:'6px solid ' + (f.status === 'open' ? 'var(--lo)' : 'var(--hi)') }}>
        <div className="spread"><div className="row"><${Avatar} pupil=${p} size=${44}/><div><h3>${p.name}</h3><p className="muted small">${fmtTime(f.at)} · ${f.source}</p></div></div>
          <span className=${'pill ' + (f.status === 'open' ? 'pill-lo' : 'pill-hi')}>${f.status === 'open' ? 'Open' : 'Closed'} · ${done}/${CHECKLIST.length}</span></div>
        <blockquote className="note" style=${{ margin:0 }}><p style=${{ fontSize:'1.05rem' }}>"${f.text}"</p><p className="small muted">Matched: ${f.words.join(', ')}</p></blockquote>
        <div className="stack" style=${{ gap:'6px' }}>${CHECKLIST.map(([k, l]) => html`<button key=${k} type="button" role="checkbox" aria-checked=${!!f.checklist[k]} className="check-item" onClick=${() => update(d => { const x = d.flags.find(y => y.id === f.id); x.checklist[k] = !x.checklist[k]; })}><span className="box">${f.checklist[k] && html`<${Icon} name="check" size=${18}/>`}</span>${l}</button>`)}</div>
        <div className="row">${f.status === 'open'
          ? html`<button className="btn btn-primary" disabled=${done < CHECKLIST.length} onClick=${() => update(d => { d.flags.find(y => y.id === f.id).status = 'closed'; })}><${Icon} name="check"/>Close flag</button>${done < CHECKLIST.length && html`<span className="muted small">Tick every step to close.</span>`}`
          : html`<button className="btn" onClick=${() => update(d => { d.flags.find(y => y.id === f.id).status = 'open'; })}><${Icon} name="refresh"/>Reopen</button>`}</div>
      </article>`; })}
  </div>`;
}

function ClassTab({ classId, setClassId }){
  const { db, staff, update, showToast, resetDemo } = useApp();
  const downloads = useCap('downloads');
  const cls = db.classes.find(c => c.id === classId);
  const pupils = cls ? db.pupils.filter(p => p.classId === cls.id).sort((a, b) => a.name.localeCompare(b.name)) : [];
  const [cards, setCards] = useState(null);
  const [name, setName] = useState('');
  const [colour, setColour] = useState('teal');
  const [keyAdult, setKeyAdult] = useState(staff.id);
  const [newClass, setNewClass] = useState('');
  const [confirmReset, setConfirmReset] = useState(false);
  const issue = async (list) => {
    const out = [];
    for (const p of list) { const pin = randomPin(); const sec = await makeSecret(pin); out.push({ id:p.id, name:p.name, pin, sec }); }
    update(d => { for (const o of out) { const x = d.pupils.find(q => q.id === o.id); x.salt = o.sec.salt; x.pinHash = o.sec.hash; x.failed = 0; x.locked = false; } });
    setCards(out.map(o => ({ name:o.name, pin:o.pin })));
  };
  const addPupil = async (e) => {
    e.preventDefault(); if (!name.trim()) return;
    const pin = randomPin(); const sec = await makeSecret(pin);
    update(d => { d.pupils.push({ id:uid('p'), classId:cls.id, name:name.trim(), avatar:colour, keyAdultId:keyAdult, base:0, attendance:100, salt:sec.salt, pinHash:sec.hash, failed:0, locked:false, buddy:{ colour:'teal', hat:'none' }, parentShare:false }); });
    setCards([{ name:name.trim(), pin }]); setName('');
  };
  const createClass = (e) => {
    e.preventDefault(); if (!newClass.trim()) return;
    const id = uid('c'); let code = newClassCode(newClass.trim());
    while (db.classes.some(c => c.code === code)) code = newClassCode(newClass.trim());
    update(d => { d.classes.push({ id, name:newClass.trim(), code, teacherId:staff.id }); d.slots[id] = SLOT_DEFS.map(s => Object.assign({}, s, { place:s.place === 'Classroom 6B' ? 'Classroom ' + newClass.trim() : s.place })); });
    setNewClass(''); setClassId(id); showToast('Class ' + newClass.trim() + ' created with code ' + code + '.');
  };
  const pdf = async () => {
    try {
      await savePdf(downloads, 'recharge-pin-cards-' + cls.name + '.pdf', (doc) => {
        const W = 90, H = 58; let i = 0;
        for (const c of cards) {
          const col = i % 2, row = Math.floor(i / 2) % 4; if (i && i % 8 === 0) doc.addPage();
          const x = 12 + col * (W + 6), y = 14 + row * (H + 8);
          doc.setDrawColor(150); doc.setLineDashPattern([2, 2], 0); doc.roundedRect(x, y, W, H, 4, 4);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(22, 48, 45); doc.text(c.name, x + 6, y + 11);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.text('Class code', x + 6, y + 21); doc.text('My PIN', x + 50, y + 21);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text(cls.code, x + 6, y + 30); doc.text(c.pin.split('').join(' '), x + 50, y + 30);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.text(['1. Type the class code.', '2. Tap your name.', '3. Enter your PIN. Keep it secret.'], x + 6, y + 40);
          i++;
        }
      });
      showToast('PIN cards saved.');
    } catch(e){ if (e && e.code === 'declined') return; showToast(e.message || 'Could not save the PDF.'); }
  };
  if (!cls) return null;
  return html`<div className="stack">
    <div className="grid-2">
      <section className="card stack" aria-label="Class code">
        <p className="eyebrow">Class ${cls.name}</p>
        <p style=${{ fontFamily:'var(--font-display)', fontSize:'2.6rem', fontWeight:700, letterSpacing:'.08em' }}>${cls.code}</p>
        <p className="muted small">Pupils type this code, tap their name, then enter their PIN. On a shared iPad, tick "Remember this class" once.</p>
        <div className="row"><button className="btn" onClick=${() => issue(pupils)} disabled=${!pupils.length}><${Icon} name="key"/>New PINs for everyone</button></div>
        <${Why} k="security"/>
      </section>
      <form className="card stack" onSubmit=${addPupil} aria-label="Add a pupil">
        <h2>Add a pupil</h2>
        <div><label className="lbl" htmlFor="np-name">Name (first name and initial)</label><input id="np-name" type="text" value=${name} onChange=${(e) => setName(e.target.value)} placeholder="e.g. Maya R."/></div>
        <div><p className="lbl">Avatar colour</p><div className="row">${AV_COLOURS.map(c => html`<button key=${c} type="button" className="swatch" style=${{ background:'var(--av-' + c + ')' }} aria-pressed=${colour === c} aria-label=${'Avatar colour ' + c} onClick=${() => setColour(c)}></button>`)}</div></div>
        <div><label className="lbl" htmlFor="np-ka">Key adult</label><select id="np-ka" className="field" value=${keyAdult} onChange=${(e) => setKeyAdult(e.target.value)}>${db.staff.filter(s => s.role !== 'dsl').map(s => html`<option key=${s.id} value=${s.id}>${s.name} · ${ROLE_LABEL[s.role]}</option>`)}</select></div>
        <div><button className="btn btn-primary" disabled=${!name.trim()}><${Icon} name="plus"/>Add pupil and make PIN</button></div>
      </form>
    </div>
    <section className="card" aria-label="Pupils and PINs">
      <h2 style=${{ marginBottom:'10px' }}>Pupils and PINs</h2>
      <div className="table-scroll"><table className="list">
        <thead><tr><th>Pupil</th><th>Key adult</th><th>Status</th><th></th></tr></thead>
        <tbody>${pupils.map(p => html`<tr key=${p.id}>
          <td><span className="row" style=${{ gap:'10px', flexWrap:'nowrap' }}><${Avatar} pupil=${p} size=${36}/><b>${p.name}</b></span></td>
          <td className="small">${(db.staff.find(s => s.id === p.keyAdultId) || {}).name}</td>
          <td>${p.locked ? html`<span className="pill pill-lo"><${Icon} name="lock" size=${14}/>Locked after 5 tries</span>` : p.failed ? html`<span className="pill pill-mid">${p.failed} wrong tries</span>` : html`<span className="pill pill-hi">OK</span>`}</td>
          <td><button className="btn" onClick=${() => issue([p])}><${Icon} name="key"/>${p.locked ? 'Unlock and reset PIN' : 'Reset PIN'}</button></td>
        </tr>`)}</tbody>
      </table></div>
    </section>
    <div className="grid-2">
      <form className="card stack" onSubmit=${createClass} aria-label="Create a class">
        <h2>Create a class</h2>
        <div><label className="lbl" htmlFor="nc-name">Class name</label><input id="nc-name" type="text" value=${newClass} onChange=${(e) => setNewClass(e.target.value)} placeholder="e.g. 5H"/></div>
        <div><button className="btn btn-primary" disabled=${!newClass.trim()}><${Icon} name="plus"/>Create class and code</button></div>
      </form>
      <section className="card stack" aria-label="Reset demo">
        <h2>Reset demo</h2>
        <p className="muted small">Puts back the fictional class 6B, 12 pupils and 6 check-ins. Removes everything added since.</p>
        <div className="row">${confirmReset
          ? html`<button className="btn btn-danger" onClick=${() => { setConfirmReset(false); resetDemo(); }}><${Icon} name="refresh"/>Yes, reset everything</button><button className="btn" onClick=${() => setConfirmReset(false)}>Cancel</button>`
          : html`<button className="btn" onClick=${() => setConfirmReset(true)}><${Icon} name="refresh"/>Reset demo</button>`}</div>
      </section>
    </div>
    ${cards && html`<${Dialog} onClose=${() => setCards(null)} label="PIN cards">
      <div className="spread"><h2>PIN cards</h2><button className="btn" onClick=${() => setCards(null)}><${Icon} name="x"/>Close</button></div>
      <div className="banner banner-info"><${Icon} name="lock"/>PINs are stored scrambled (hashed), so this is the only time they are shown. Save or copy them now.</div>
      <div className="pin-cards">${cards.map(c => html`<div key=${c.name} className="pin-cardp"><b>${c.name}</b><span className="small muted">Class code ${cls.code}</span><span className="big">${c.pin}</span></div>`)}</div>
      ${downloads !== null && html`<div><button className="btn btn-primary" onClick=${pdf} disabled=${downloads === undefined}><${Icon} name="download"/>Save PIN cards as PDF</button></div>`}
    <//>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
